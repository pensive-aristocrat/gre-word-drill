<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GRE Word Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow study column; the index card is the focal object, tabs above, progress beneath */
:root{
  --bg:#e9edf1; --paper:#fbfcfd; --ink:#1b2733; --muted:#5d6b78; --line:#d3dae1;
  --accent:#2f5d8a; --accent-ink:#ffffff; --margin:#d4646a; --rule:#dfe7f0;
  --good:#2f7d4f; --good-bg:#e3f2e8; --bad:#b03a3a; --bad-bg:#f7e2e2; --hl:#f3d36b;
  --b0:#c9d2db; --b1:#a8bdd2; --b2:#7fa0c2; --b3:#5a84b0; --b4:#3c6a9a; --b5:#2f7d4f;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --paper:#1b222a; --ink:#e6ebf0; --muted:#97a4b1; --line:#2c3640;
  --accent:#7fb0e0; --accent-ink:#0f1720; --margin:#c96a70; --rule:#232c35;
  --good:#6cc28f; --good-bg:#1d3326; --bad:#ec8a8a; --bad-bg:#3a2224; --hl:#8a7426;
  --b0:#36414c; --b1:#3f5872; --b2:#4b6f94; --b3:#5c88b6; --b4:#7aa6d4; --b5:#6cc28f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --paper:#1b222a; --ink:#e6ebf0; --muted:#97a4b1; --line:#2c3640;
  --accent:#7fb0e0; --accent-ink:#0f1720; --margin:#c96a70; --rule:#232c35;
  --good:#6cc28f; --good-bg:#1d3326; --bad:#ec8a8a; --bad-bg:#3a2224; --hl:#8a7426;
  --b0:#36414c; --b1:#3f5872; --b2:#4b6f94; --b3:#5c88b6; --b4:#7aa6d4; --b5:#6cc28f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:28px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:14px}
.streak b{color:var(--ink);font-weight:500}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:600 14px var(--sans);color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
button{font-family:var(--sans)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* index card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;position:relative;padding:22px 22px 22px 40px;
  background-image:linear-gradient(var(--paper) 46px, transparent 46px),repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px);
  box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(20,40,60,.35)}
.card::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;background:var(--margin);opacity:.55}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.qtype{text-transform:uppercase;letter-spacing:.08em}
.prompt{font-family:var(--serif);font-size:34px;font-weight:700;margin:14px 0 2px;line-height:1.15;overflow-wrap:anywhere}
.prompt.def{font-size:21px;font-weight:500}
.pos{font-style:italic;color:var(--muted);font-family:var(--serif)}
.ask{color:var(--muted);margin:6px 0 16px;font-size:14px}
.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:480px){.choices.two{grid-template-columns:1fr}.prompt{font-size:28px}}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:15px;color:var(--ink);cursor:pointer;min-width:0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none;margin-top:2px}
.choice.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice.right{background:var(--good-bg);border-color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice:disabled{cursor:default}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.fb .w{font-family:var(--serif);font-size:22px;font-weight:700}
.fb dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.fb dt{color:var(--muted);font-size:13px;padding-top:2px}
.fb dd{margin:0;min-width:0}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--b0)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend s{width:10px;height:10px;border-radius:2px;display:inline-block;text-decoration:none}
.days{display:flex;gap:4px;align-items:flex-end;height:60px}
.days div{flex:1;background:var(--b3);border-radius:2px 2px 0 0;min-height:2px}
.days div.zero{background:var(--line)}
.dlabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:15px var(--sans)}
select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:14px var(--sans)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.item{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.item:first-child{border-top:0}
.item .w{font-family:var(--serif);font-weight:700;font-size:18px}
.item .m{grid-column:1/-1;font-size:14px}
.item .s{grid-column:1/-1;font-size:13px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;align-self:start;border:1px solid var(--line);color:var(--muted)}
.chip.learn{color:var(--accent);border-color:var(--accent)}
.chip.master{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.note{font-size:13px;color:var(--muted)}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.acct b{font-family:var(--mono);font-weight:500}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px var(--sans);cursor:pointer;padding:4px 0}
.authform{display:grid;gap:10px;width:100%}
.authform .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.authform .fields{grid-template-columns:1fr}}
.authform input{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px var(--sans)}
.err{color:var(--bad);font-size:13px}
.s.cover{filter:blur(5px);cursor:pointer;user-select:none}
.synok{font-size:11px;font-weight:600;color:var(--good);margin-left:6px;letter-spacing:.04em}
.intro .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.syns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.syns span{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:14px}
.check-row{margin-top:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.btn.danger{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>GRE Word Drill</h1>
      <div class="sub">1,348 words from the KMF 1300 TC &amp; SE answer choices</div>
    </div>
    <div class="streak"><span>Streak <b id="streak">0</b> days</span><span>Mastered <b id="mastHead">0</b></span></div>
  </header>

  <div class="acct" id="acct"></div>

  <nav role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-v="today">Today</button>
    <button role="tab" id="tab-words" aria-selected="false" data-v="words">All words</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-v="progress">Progress</button>
  </nav>

  <section id="v-today"></section>
  <section id="v-words" hidden>
    <div class="search">
      <input id="q" type="search" placeholder="Search a word, meaning or synonym" autocomplete="off">
      <select id="filter" aria-label="Filter">
        <option value="all">All words</option><option value="new">Not started</option>
        <option value="learn">Learning</option><option value="master">Mastered</option><option value="weak">Missed recently</option><option value="synweak">Synonyms not known yet</option>
      </select>
      <label class="note" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cover"> Hide synonyms (tap to reveal)</label>
    </div>
    <div class="note" id="count" style="margin:10px 0"></div>
    <div class="list" id="list"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="more" hidden>Show more</button></div>
  </section>
  <section id="v-progress" hidden></section>
  <div class="note" id="saveNote"></div>
</div>

const W = RAW.map((r,i)=>({i, word:r[0], pos:r[1], meaning:r[2], syn:r[3].split(/,\s*/).filter(Boolean), group:r[4], freq:r[5]}));
const byGroup = {}; W.forEach(w=>{(byGroup[w.group] ||= []).push(w)});
const INT = [0,1,2,4,7,15,30];      // days until next review for each box
const MASTER = 5;
const LS = "gre-drill-v1";

function dayNum(d=new Date()){return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function dayKey(n){const d=new Date(n*86400000);return d.toISOString().slice(0,10)}
const TODAY = dayNum();
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state ---------- */
// p[word] = [box, dueDay, timesSeen, timesRight, lastWrongDay, synonymScore 0-3]
let S = {v:1, p:{}, newPerDay:20, days:{}, streak:0, lastDay:null, updatedAt:0};
try{const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s&&s.v===1) S=Object.assign(S,s)}catch(e){}

let docRef=null, saveTimer=null, saving=false, pending=false;
function persist(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!docRef) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,1500);
}
async function flush(){
  if(!docRef) return;
  if(saving){pending=true;return}
  saving=true;
  try{await docRef.set(JSON.parse(JSON.stringify(S))); setNote("Progress saved to your account.")}
  catch(e){setNote("Couldn't save to your account just now. Progress is kept in this browser and will sync on your next answer.")}
  saving=false;
  if(pending){pending=false;flush()}
}
function setNote(t){document.getElementById("saveNote").textContent=t}

/* ---------- account ---------- */
const TK="gre-drill-token", UK="gre-drill-user";
let token=null, uid=null;
try{token=localStorage.getItem(TK); uid=localStorage.getItem(UK)}catch(e){}
function api(path,opts={}){
  return fetch(path,Object.assign({},opts,{headers:Object.assign({"Content-Type":"application/json"},token?{Authorization:"Bearer "+token}:{})}))
    .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Something went wrong. Try again.");e.status=r.status;throw e}return j});
}
const remoteRef={set:async d=>{
  try{await api("/api/progress",{method:"PUT",body:JSON.stringify({state:d})})}
  catch(e){if(e.status===401){signedOut("You were signed out. Sign in again to keep saving.")} throw e}
}};
function signedOut(msg){
  token=null;uid=null;docRef=null;
  try{localStorage.removeItem(TK);localStorage.removeItem(UK)}catch(e){}
  renderAcct(); setNote(msg||"Signed out. Progress on this device is kept in this browser.");
}
async function syncAfterLogin(){
  setNote("Loading your progress…");
  const r=await api("/api/progress");
  const remote=r.state;
  if(remote && remote.v===1 && (remote.updatedAt||0) >= (S.updatedAt||0)){
    S=Object.assign({v:1,p:{},newPerDay:20,days:{},streak:0,lastDay:null,updatedAt:0},remote);
    try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  }
  docRef=remoteRef;
  if(!remote || (S.updatedAt||0) > (remote.updatedAt||0)) await flush();
  session=null; renderAll();
  setNote("Progress is saved to your account ("+uid+").");
}
function renderAcct(mode){
  const el=document.getElementById("acct");
  if(token&&uid){
    el.innerHTML=`<span>Signed in as <b>${esc(uid)}</b>. Progress is saved to your account.</span><button class="linkbtn" id="out">Sign out</button>`;
    document.getElementById("out").onclick=async()=>{try{await flush()}catch(e){} try{await api("/api/auth",{method:"POST",body:JSON.stringify({action:"logout"})})}catch(e){} signedOut()};
    return;
  }
  if(!mode){
    el.innerHTML=`<span>Sign in to keep your progress on every device.</span><span class="row"><button class="linkbtn" id="si">Sign in</button><button class="linkbtn" id="su">Create account</button></span>`;
    document.getElementById("si").onclick=()=>renderAcct("login");
    document.getElementById("su").onclick=()=>renderAcct("signup");
    return;
  }
  const isUp=mode==="signup";
  el.innerHTML=`<form class="authform" id="af">
    <strong>${isUp?"Create an account":"Sign in"}</strong>
    <div class="fields">
      <input id="aid" name="id" placeholder="ID (e.g. nabil)" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <input id="apw" name="password" type="password" placeholder="Password (6+ characters)" autocomplete="${isUp?"new-password":"current-password"}" required>
    </div>
    <div class="err" id="aerr"></div>
    <div class="row"><button class="btn" type="submit" id="ago">${isUp?"Create account":"Sign in"}</button>
      <button class="linkbtn" type="button" id="aswitch">${isUp?"I already have an account":"Create an account instead"}</button>
      <button class="linkbtn" type="button" id="acancel" style="color:var(--muted)">Cancel</button></div>
    ${isUp?`<p class="note" style="margin:0">There's no password reset, so pick a password you'll remember. Any progress on this device moves into the new account.</p>`:""}
  </form>`;
  document.getElementById("aswitch").onclick=()=>renderAcct(isUp?"login":"signup");
  document.getElementById("acancel").onclick=()=>renderAcct();
  document.getElementById("aid").focus();
  document.getElementById("af").onsubmit=async e=>{
    e.preventDefault();
    const b=document.getElementById("ago"), er=document.getElementById("aerr");
    b.disabled=true; er.textContent="";
    try{
      const r=await api("/api/auth",{method:"POST",body:JSON.stringify({action:mode,id:document.getElementById("aid").value,password:document.getElementById("apw").value})});
      token=r.token; uid=r.id;
      try{localStorage.setItem(TK,token);localStorage.setItem(UK,uid)}catch(e){}
      renderAcct(); await syncAfterLogin();
    }catch(err){er.textContent=err.message; b.disabled=false}
  };
}
renderAcct();
if(token&&uid){ syncAfterLogin().catch(e=>{ if(e.status!==401) setNote("Couldn't reach the server. Progress is kept in this browser and will sync when you're back online."); docRef=docRef||remoteRef }) }
else setNote("Not signed in: progress is saved in this browser only.");

/* ---------- scheduling ---------- */
const SYNOK=2;
function synScore(w){const p=S.p[w.word];return p?(p[5]||0):0}
function status(w){const p=S.p[w.word]; if(!p) return "new"; return (p[0]>=MASTER && (p[5]||0)>=SYNOK)?"master":"learn"}
function todayRec(){return S.days[dayKey(TODAY)] ||= {answered:0,correct:0,newSeen:0}}
function dueList(){return W.filter(w=>{const p=S.p[w.word];return p&&p[1]<=TODAY}).sort((a,b)=>S.p[a.word][1]-S.p[b.word][1]||S.p[a.word][0]-S.p[b.word][0])}
function newList(n){return W.filter(w=>!S.p[w.word]).sort((a,b)=>b.freq-a.freq||a.word.localeCompare(b.word)).slice(0,Math.max(0,n))}

let session=null;
function buildSession(extraNew=0){
  const due=dueList();
  const newN = extraNew || Math.max(0, S.newPerDay - todayRec().newSeen);
  const fresh=newList(newN);
  const q=[]; let a=0,b=0;
  while(a<due.length||b<fresh.length){ // mix: 3 reviews then 1 new
    for(let k=0;k<3&&a<due.length;k++) q.push({w:due[a++],isNew:false});
    if(b<fresh.length) q.push({w:fresh[b++],isNew:true,intro:true});
  }
  session={queue:q,pos:0,right:0,wrong:0,first:0,firstRight:0,missed:new Set(),started:false,mode:"main"};
}
function drillPool(){return W.filter(w=>S.p[w.word])}
function buildDrill(n=20){
  const pool=shuffle(drillPool()).sort((a,b)=>synScore(a)-synScore(b)).slice(0,n);
  session={queue:pool.map(w=>({w,isNew:false})),pos:0,right:0,wrong:0,first:0,firstRight:0,missed:new Set(),started:false,mode:"drill"};
}

function markStreak(){
  if(S.lastDay===TODAY) return;
  S.streak = (S.lastDay===TODAY-1) ? (S.streak||0)+1 : 1;
  S.lastDay = TODAY;
}

function grade(w, ok, q, mode){
  const rec=todayRec(); rec.answered++; if(ok) rec.correct++;
  let p=S.p[w.word];
  if(!p){p=S.p[w.word]=[0,TODAY,0,0,null,0]; rec.newSeen++}
  if(p.length<6) p[5]=0;
  p[2]++; if(ok) p[3]++;
  if(mode!=="drill"){
    if(ok){ p[0]=Math.min(p[0]+1,INT.length-1); p[1]=TODAY+INT[p[0]] }
    else { p[0]=0; p[1]=TODAY }
  }
  if(q.syn) p[5]= ok ? Math.min(p[5]+1,3) : 0;
  if(!ok) p[4]=TODAY;
  markStreak(); persist();
}

/* ---------- question building ---------- */
function others(w,n,filter=()=>true){
  const pool=shuffle(W.filter(x=>x.group!==w.group && x!==w && filter(x)));
  return pool.slice(0,n);
}
function singles(w){const s=w.syn.filter(x=>!x.includes(" "));return s.length>=2?s:w.syn}
function synDistractors(w,n,avoid=[]){
  const own=new Set(w.syn.map(s=>s.toLowerCase()).concat(avoid.map(s=>s.toLowerCase()),[w.word]));
  const ds=[]; for(const o of others(w,60)){const c=rnd(o.syn.filter(x=>!x.includes(" ")).length?o.syn.filter(x=>!x.includes(" ")):o.syn); if(c&&!own.has(c.toLowerCase())&&!ds.includes(c)) ds.push(c); if(ds.length===n) break}
  return ds;
}
function makeQ(item){
  const w=item.w, p=S.p[w.word], box=p?p[0]:-1, ss=p?(p[5]||0):0;
  const partners=(byGroup[w.group]||[]).filter(x=>x!==w);
  let types;
  if(session&&session.mode==="drill") types=["allsyn","allsyn","s2w","w2s"];
  else if(box<=0) types=["w2m","w2s"];
  else if(box===1) types=["m2w","w2s","s2w","allsyn"];
  else types=["m2w","w2m","s2w","allsyn"].concat(partners.length?["se"]:[]);
  if(box>=1 && ss<SYNOK && !(session&&session.mode==="drill")) types=types.concat(["allsyn","s2w"]);
  const t=rnd(types);
  if(t==="allsyn"){
    const tr=shuffle(singles(w)).slice(0,4);
    const ds=synDistractors(w,8-tr.length);
    return {t,label:"All synonyms",w,prompt:w.word,pos:w.pos,ask:"Select every synonym of this word, then press Check.",opts:shuffle([...tr,...ds]).map(x=>({text:x,ok:tr.includes(x)})),def:false,pickAll:true,syn:true,hl:tr};
  }
  if(t==="s2w"){
    const s0=rnd(singles(w));
    const opts=[w]; for(const o of others(w,40)){ if(!o.syn.some(x=>x.toLowerCase()===s0.toLowerCase())&&o.word!==s0) opts.push(o); if(opts.length===4) break }
    return {t,label:"Synonym to word",w,prompt:s0,pos:"",ask:"Which GRE word is this a synonym of?",opts:shuffle(opts).map(o=>({text:o.word,ok:o===w})),def:false,syn:true,hl:[s0]};
  }
  if(t==="w2m"){
    const opts=shuffle([w,...others(w,3)]);
    return {t,label:"Meaning",w,prompt:w.word,pos:w.pos,ask:"What does this word mean?",opts:opts.map(o=>({text:o.meaning,ok:o===w})),def:false};
  }
  if(t==="m2w"){
    const opts=shuffle([w,...others(w,3,x=>x.pos===w.pos)]);
    if(opts.length<4){const extra=others(w,4-opts.length,x=>!opts.includes(x)); opts.push(...extra)}
    return {t,label:"Word for the meaning",w,prompt:w.meaning,pos:w.pos,ask:"Which word fits this meaning?",opts:opts.map(o=>({text:o.word,ok:o===w})),def:true};
  }
  if(t==="w2s"){
    const single=w.syn.filter(s=>!s.includes(" "));
    const ans=rnd(single.length?single:w.syn);
    const ds=synDistractors(w,3);
    return {t,label:"Synonym",w,prompt:w.word,pos:w.pos,ask:"Pick the closest synonym.",opts:shuffle([ans,...ds]).map(s=>({text:s,ok:s===ans})),def:false,syn:true,hl:[ans]};
  }
  // se: sentence-equivalence style pair
  const partner=rnd(partners);
  const used=new Set([w.group]); const ds=[];
  for(const o of shuffle(W)){ if(!used.has(o.group)){used.add(o.group);ds.push(o)} if(ds.length===4) break }
  const opts=shuffle([w,partner,...ds]);
  return {t,label:"Sentence equivalence",w,partner,prompt:"Pick the two words closest in meaning",pos:"",ask:"Choose exactly two, the way GRE Sentence Equivalence pairs work.",opts:opts.map(o=>({text:o.word,ok:o===w||o===partner})),def:true,multi:true};
}

/* ---------- rendering: Today ---------- */
const vToday=document.getElementById("v-today");
let cur=null, answered=false, picks=[];

function renderHead(){
  document.getElementById("streak").textContent = (S.lastDay===TODAY||S.lastDay===TODAY-1)?(S.streak||0):0;
  document.getElementById("mastHead").textContent = W.filter(w=>status(w)==="master").length;
}

function renderStart(){
  const due=dueList().length, rec=todayRec();
  const newLeft=Math.max(0,S.newPerDay-rec.newSeen), unseen=W.filter(w=>!S.p[w.word]).length;
  const n=Math.min(newLeft,unseen);
  const doneToday = due===0 && n===0;
  vToday.innerHTML = `
  <div class="panel">
    <p class="big">${doneToday?"Today's set is done":"Today's set"}</p>
    <div class="stats">
      <div class="stat"><b>${due}</b><span>Reviews due</span></div>
      <div class="stat"><b>${n}</b><span>New words</span></div>
      <div class="stat"><b>${rec.answered}</b><span>Answered today</span></div>
      <div class="stat"><b>${rec.answered?Math.round(rec.correct/rec.answered*100)+"%":"–"}</b><span>Accuracy today</span></div>
    </div>
    <div class="row">
      ${doneToday?`<button class="btn" id="extra">Learn 10 more words</button>`:`<button class="btn" id="go">Start (${due+n} cards)</button>`}
      <label class="note" for="npd">New words per day</label>
      <select id="npd">${[10,15,20,30,40,50].map(v=>`<option ${v===S.newPerDay?"selected":""}>${v}</option>`).join("")}</select>
    </div>
    <div class="row" style="border-top:1px dashed var(--line);padding-top:14px">
      <button class="btn ghost" id="drill" ${drillPool().length?"":"disabled"}>Synonym drill (20 cards)</button>
      <span class="note">${drillPool().length?`Synonyms known for ${W.filter(w=>synScore(w)>=SYNOK).length} of ${drillPool().length} words you've started. The drill picks the ones you know least.`:"Start some words first, then drill their synonyms here."}</span>
    </div>
  </div>`;
  const go=document.getElementById("go"); if(go) go.onclick=()=>{buildSession();startSession()};
  const ex=document.getElementById("extra"); if(ex) ex.onclick=()=>{buildSession(10);startSession()};
  const dr=document.getElementById("drill"); if(dr) dr.onclick=()=>{buildDrill();startSession()};
  document.getElementById("npd").onchange=e=>{S.newPerDay=+e.target.value;persist();renderStart()};
}

function startSession(){
  if(!session.queue.length){renderStart();return}
  session.started=true; nextCard();
}

function nextCard(){
  if(session.pos>=session.queue.length){renderDone();return}
  const total=session.queue.length, i=session.pos, it=session.queue[i];
  if(it.intro){
    cur=null;
    vToday.innerHTML=`<div class="bar" aria-label="Session progress"><i style="width:${i/total*100}%"></i></div>
    <div class="card intro" style="margin-top:12px">
      <div class="meta"><span class="tag">New word · study it</span><span>${i+1} / ${total}</span></div>
      <div class="prompt">${esc(it.w.word)} <span class="pos" style="font-size:16px;font-weight:400">${esc(it.w.pos)}</span></div>
      <div style="font-size:17px;margin:6px 0 12px">${esc(it.w.meaning)}</div>
      <div class="note">Synonyms to learn</div>
      <div class="syns">${it.w.syn.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      <div class="row check-row"><button class="btn" id="next">Got it <span class="note" style="color:inherit;opacity:.7">(Enter)</span></button></div>
      <p class="note">You'll be quiz­zed on this word a few cards from now.</p>
    </div>`;
    const nb=document.getElementById("next");
    nb.onclick=()=>{session.queue.splice(Math.min(i+4,session.queue.length),0,{w:it.w,isNew:true});session.pos++;nextCard()};
    nb.focus({preventScroll:true});
    return;
  }
  cur=makeQ(it); answered=false; picks=[];
  vToday.innerHTML=`
  <div class="bar" aria-label="Session progress"><i style="width:${i/total*100}%"></i></div>
  <div class="card" style="margin-top:12px">
    <div class="meta"><span class="qtype">${cur.label}${session.queue[i].isNew?" · new word":""}</span><span>${i+1} / ${total}</span></div>
    <div class="prompt ${cur.def?"def":""}">${esc(cur.prompt)} ${cur.pos&&!cur.def?`<span class="pos" style="font-size:16px;font-weight:400">${esc(cur.pos)}</span>`:""}</div>
    <div class="ask">${esc(cur.ask)}</div>
    <div class="choices ${cur.multi?"two":""}" id="choices">
      ${cur.opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o.text)}</span></button>`).join("")}
    </div>
    ${cur.pickAll?`<div class="row check-row" id="checkRow"><button class="btn" id="check">Check</button><span class="note">Press 1–8 to toggle, Enter to check</span></div>`:""}
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  if(cur.pickAll) document.getElementById("check").onclick=submitAll;
}

function choose(k){
  if(answered) return;
  const btns=[...document.querySelectorAll(".choice")];
  if(cur.pickAll){
    const at=picks.indexOf(k);
    if(at>=0){picks.splice(at,1);btns[k].classList.remove("sel")} else {picks.push(k);btns[k].classList.add("sel")}
    return;
  }
  if(cur.multi){
    const at=picks.indexOf(k);
    if(at>=0){picks.splice(at,1);btns[k].classList.remove("sel")}
    else if(picks.length<2){picks.push(k);btns[k].classList.add("sel")}
    if(picks.length<2) return;
  } else picks=[k];
  finish(picks.every(p=>cur.opts[p].ok));
}
function submitAll(){
  if(answered) return;
  const ok = cur.opts.every((o,j)=>o.ok===picks.includes(j));
  const cr=document.getElementById("checkRow"); if(cr) cr.remove();
  finish(ok);
}
function finish(ok){
  answered=true;
  const btns=[...document.querySelectorAll(".choice")];
  btns.forEach((b,j)=>{b.disabled=true; if(cur.opts[j].ok) b.classList.add("right"); else if(picks.includes(j)) b.classList.add("wrong")});
  const item=session.queue[session.pos];
  grade(cur.w, ok, cur, session.mode);
  if(!item.retry){session.first++; if(ok) session.firstRight++}
  if(ok) session.right++; else {session.wrong++; session.missed.add(cur.w.word);
    // see it again a few cards later in this session
    session.queue.splice(Math.min(session.pos+4,session.queue.length),0,{w:cur.w,isNew:false,retry:true});
  }
  showFeedback(ok);
  renderHead();
}

function wordBlock(w,hl){
  return `<div class="w">${esc(w.word)} <span class="pos" style="font-size:15px;font-weight:400">${esc(w.pos)}</span></div>
  <dl><dt>Meaning</dt><dd>${esc(w.meaning)}</dd>
  <dt>Synonyms</dt><dd>${w.syn.map(s=>(hl||[]).includes(s)?`<mark>${esc(s)}</mark>`:esc(s)).join(", ")}</dd></dl>`;
}
function showFeedback(ok){
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="fb">
    <div class="verdict ${ok?"ok":"no"}">${ok?"Correct":(cur.pickAll?"Not quite. Green ones were the synonyms. It will come back in a few cards.":"Not quite. It will come back in a few cards.")}</div>
    ${wordBlock(cur.w,cur.hl)}
    ${cur.partner?`<div style="margin-top:8px">${wordBlock(cur.partner)}</div>`:""}
    <div class="row" style="margin-top:8px"><button class="btn" id="next">Next <span class="note" style="color:inherit;opacity:.7">(Enter)</span></button></div>
  </div>`;
  const nb=document.getElementById("next"); nb.onclick=()=>{session.pos++;nextCard()}; nb.focus({preventScroll:true});
}

function renderDone(){
  const tot=session.right+session.wrong, first=session.first, firstRight=session.firstRight;
  const missed=[...session.missed].map(x=>W.find(w=>w.word===x));
  const wasDrill=session.mode==="drill";
  session=null;
  vToday.innerHTML=`<div class="panel">
    <p class="big">Session complete</p>
    <div class="stats">
      <div class="stat"><b>${tot}</b><span>Answers</span></div>
      <div class="stat"><b>${first?Math.round(firstRight/first*100):0}%</b><span>First-try correct</span></div>
      <div class="stat"><b>${S.streak||0}</b><span>Day streak</span></div>
      <div class="stat"><b>${W.filter(w=>status(w)==="master").length}</b><span>Mastered</span></div>
    </div>
    ${missed.length?`<div><div class="note" style="margin-bottom:6px">Words you missed today</div><div class="list">${missed.map(w=>`<div class="item"><span class="w">${esc(w.word)}</span><span class="chip">${esc(w.pos)}</span><span class="m">${esc(w.meaning)}</span><span class="s">${esc(w.syn.join(", "))}</span></div>`).join("")}</div></div>`:`<p class="note">No misses this session.</p>`}
    <div class="row"><button class="btn" id="again">Back to today</button>${wasDrill?`<button class="btn ghost" id="more10">Drill 20 more</button>`:`<button class="btn ghost" id="more10">Learn 10 more words</button>`}</div>
  </div>`;
  document.getElementById("again").onclick=renderStart;
  document.getElementById("more10").onclick=()=>{wasDrill?buildDrill():buildSession(10);startSession()};
}

document.addEventListener("keydown",e=>{
  if(document.getElementById("v-today").hidden||!session) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(!cur){ if(e.key==="Enter"&&e.target.id!=="next"){const n=document.getElementById("next");if(n){e.preventDefault();n.click()}} return }
  if(!answered && /^[1-8]$/.test(e.key)){const k=+e.key-1; if(k<cur.opts.length){e.preventDefault();choose(k)}}
  else if(!answered && cur.pickAll && e.key==="Enter"){e.preventDefault();submitAll()}
  else if(answered && e.key==="Enter"){e.preventDefault();const n=document.getElementById("next");if(n)n.click()}
});

/* ---------- All words ---------- */
let shown=60;
function renderList(){
  const q=document.getElementById("q").value.trim().toLowerCase(), f=document.getElementById("filter").value;
  const rows=W.filter(w=>{
    const st=status(w);
    if(f==="new"&&st!=="new") return false;
    if(f==="learn"&&st!=="learn") return false;
    if(f==="master"&&st!=="master") return false;
    if(f==="weak"){const p=S.p[w.word]; if(!p||p[4]==null||TODAY-p[4]>14) return false}
    if(f==="synweak"&&(st==="new"||synScore(w)>=SYNOK)) return false;
    if(!q) return true;
    return w.word.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q)||w.syn.some(s=>s.toLowerCase().includes(q));
  });
  document.getElementById("count").textContent=`${rows.length} word${rows.length===1?"":"s"}`;
  const lab={new:"Not started",learn:"Learning",master:"Mastered"};
  const cov=document.getElementById("cover").checked;
  document.getElementById("list").innerHTML=rows.slice(0,shown).map(w=>{const st=status(w);
    return `<div class="item"><span class="w">${esc(w.word)} <span class="pos" style="font-size:14px;font-weight:400">${esc(w.pos)}</span>${st!=="new"&&synScore(w)>=SYNOK?`<span class="synok">SYNONYMS ✓</span>`:""}</span><span class="chip ${st}">${lab[st]}</span><span class="m">${esc(w.meaning)}</span><span class="s ${cov?"cover":""}" title="${cov?"Tap to reveal":""}">${esc(w.syn.join(", "))}</span></div>`}).join("")||`<div class="item"><span class="m note">No words match.</span></div>`;
  document.getElementById("more").hidden = rows.length<=shown;
}
document.getElementById("q").addEventListener("input",()=>{shown=60;renderList()});
document.getElementById("filter").addEventListener("change",()=>{shown=60;renderList()});
document.getElementById("more").onclick=()=>{shown+=120;renderList()};
document.getElementById("cover").addEventListener("change",renderList);
document.getElementById("list").addEventListener("click",e=>{const s=e.target.closest(".s.cover");if(s){s.classList.remove("cover");s.title=""}});

/* ---------- Progress ---------- */
function renderProgress(){
  const boxes=[0,0,0,0,0,0,0]; let newC=0;
  W.forEach(w=>{const p=S.p[w.word]; if(!p) newC++; else boxes[status(w)==="master"?5:Math.min(p[0],4)]++});
  const total=W.length, master=boxes[5], learning=total-newC-master, synK=W.filter(w=>S.p[w.word]&&synScore(w)>=SYNOK).length;
  const ans=Object.values(S.days).reduce((a,d)=>a+d.answered,0), cor=Object.values(S.days).reduce((a,d)=>a+d.correct,0);
  const segs=[["var(--b1)","Box 1",boxes[0]+boxes[1]],["var(--b2)","Box 2",boxes[2]],["var(--b3)","Box 3",boxes[3]],["var(--b4)","Box 4+",boxes[4]],["var(--b5)","Mastered",master]];
  const last=[];for(let d=TODAY-13;d<=TODAY;d++){last.push((S.days[dayKey(d)]||{}).answered||0)}
  const mx=Math.max(1,...last);
  const unseen=newC, perDay=S.newPerDay;
  const v=document.getElementById("v-progress");
  v.innerHTML=`<div class="panel">
    <div class="stats">
      <div class="stat"><b>${master}</b><span>Mastered</span></div>
      <div class="stat"><b>${learning}</b><span>Learning</span></div>
      <div class="stat"><b>${newC}</b><span>Not started</span></div>
      <div class="stat"><b>${synK}</b><span>Synonyms known</span></div>
      <div class="stat"><b>${ans?Math.round(cor/ans*100)+"%":"–"}</b><span>Accuracy</span></div>
    </div>
    <div>
      <div class="stack" role="img" aria-label="${master} mastered, ${learning} learning, ${newC} not started out of ${total}">${segs.map(s=>`<i style="width:${s[2]/total*100}%;background:${s[0]}"></i>`).join("")}</div>
      <div class="legend" style="margin-top:8px">${segs.map(s=>`<span><s style="background:${s[0]}"></s>${s[1]} · ${s[2]}</span>`).join("")}<span><s style="background:var(--b0)"></s>Not started · ${newC}</span></div>
    </div>
    <div>
      <div class="note" style="margin-bottom:6px">Answers per day, last 14 days</div>
      <div class="days">${last.map(n=>`<div class="${n?"":"zero"}" style="height:${n?Math.max(6,n/mx*100):3}%" title="${n} answers"></div>`).join("")}</div>
      <div class="dlabels"><span>${dayKey(TODAY-13).slice(5)}</span><span>today</span></div>
    </div>
    <p class="note">At ${perDay} new words a day, you'll have seen every word in about ${Math.ceil(unseen/perDay)} more day${Math.ceil(unseen/perDay)===1?"":"s"}.</p>
    <div class="row"><button class="btn ghost" id="exp">Export progress</button><label class="btn ghost" for="imp" style="cursor:pointer">Import progress</label><input type="file" id="imp" accept="application/json" hidden></div>
    <p class="note">Progress lives in this browser. Export a backup file, then import it on your phone or another computer to continue there.</p>
    <div class="confirm" id="resetBox"><button class="btn ghost" id="reset">Reset all progress</button></div>
  </div>`;
  document.getElementById("exp").onclick=()=>{
    const b=new Blob([JSON.stringify(S)],{type:"application/json"});const u=URL.createObjectURL(b);
    const l=document.createElement("a");l.href=u;l.download="gre-progress-"+dayKey(TODAY)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  document.getElementById("imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(d.v!==1||!d.p)throw 0;S=Object.assign(S,d);persist();renderAll();setNote("Progress imported.")}
    catch(err){setNote("That file isn't a GRE Word Drill progress export.")}};
  document.getElementById("reset").onclick=()=>{
    document.getElementById("resetBox").innerHTML=`<span>This erases every word's progress and your streak.</span><button class="btn danger" id="yes">Erase progress</button><button class="btn ghost" id="no">Keep it</button>`;
    document.getElementById("no").onclick=renderProgress;
    document.getElementById("yes").onclick=()=>{S.p={};S.days={};S.streak=0;S.lastDay=null;persist();renderAll()};
  };
}

/* ---------- tabs ---------- */
let view="today";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["today","words","progress"].forEach(v=>document.getElementById("v-"+v).hidden=v!==view);
  if(view==="words") renderList(); if(view==="progress") renderProgress();
  if(view==="today" && !(session&&session.started)) renderStart();
});
function renderAll(){renderHead(); if(!(session&&session.started)) renderStart(); if(view==="words")renderList(); if(view==="progress")renderProgress()}
renderAll();
</script>
